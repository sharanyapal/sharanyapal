name: Refresh profile dashboard

"on":
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Off the top of the hour; GitHub may still delay a scheduled run.
    - cron: '17,47 * * * *'

permissions:
  contents: read

concurrency:
  group: profile-dashboard-main
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'sharanyapal/sharanyapal' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out profile source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7, verified 2026-11-08
        with:
          ref: main
          fetch-depth: 1

      - name: Test dashboard rules
        run: python3 -m unittest discover -s scripts -p 'test_*.py' -v

      - name: Read public GitHub data and render profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_profile.py --owner sharanyapal --timezone Asia/Kolkata

      - name: Save changed signals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- README.md assets data/profile.json
          if git diff --cached --quiet; then
            echo "No signal change; no commit needed."
            exit 0
          fi
          git commit -m "chore(profile): refresh public build signals"
          git pull --rebase origin main
          git push origin HEAD:main
